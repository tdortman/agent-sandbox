[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.47.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.91"
base64 = "0.23.0"
bytes = "1.12.1"
caps = "0.5.6"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
getrandom = "0.4.3"
globset = "0.4.19"
hickory-proto = "0.26.1"
http = "1.5.0"
idna = "1.1.0"
libc = "0.2.189"
nfq-updated = "0.2.6"
nix = "0.31.3"

rama-dns = { version = "0.3.0", default-features = false }
rama-http = { version = "0.3.0", default-features = false }
rama-http-core = { version = "0.3.0", default-features = false }
rama-net = { version = "0.3.0", default-features = false, features = ["std"] }
rama-tcp = "0.3.0"
rama-tls = { version = "0.3.0", default-features = false }
rcgen = { version = "0.14.8", features = ["pem", "ring", "x509-parser"] }
ring = "0.17.14"
rustls = { version = "0.23.42", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "v7"] }
which = "8.0.5"
zvariant = "5.13"

[workspace.dependencies.h3]
git = "https://github.com/hyperium/h3.git"
rev = "c38a1af632afbbbc8f6716c196ad67f40bc122e3"

[workspace.dependencies.h3-datagram]
git = "https://github.com/hyperium/h3.git"
rev = "c38a1af632afbbbc8f6716c196ad67f40bc122e3"

[workspace.dependencies.h3-quinn]
git = "https://github.com/hyperium/h3.git"
rev = "c38a1af632afbbbc8f6716c196ad67f40bc122e3"
features = ["datagram"]

[workspace.dependencies.h3-webtransport]
git = "https://github.com/hyperium/h3.git"
rev = "c38a1af632afbbbc8f6716c196ad67f40bc122e3"

[workspace.dependencies.quinn]
version = "0.11.11"
default-features = false
features = ["futures-io", "runtime-tokio", "rustls-ring"]

[workspace.dependencies.rama-core]
version = "0.3.0"
default-features = false
features = ["std"]

[workspace.dependencies.rama-http-backend]
version = "0.3.0"
default-features = false
features = ["tls"]

[workspace.dependencies.rama-tls-rustls]
version = "0.3.0"
default-features = false
features = ["http", "ring"]

[workspace.dependencies.x25519-dalek]
version = "3.0.0"
default-features = false
features = ["static_secrets", "zeroize"]

[workspace.dependencies.seccompiler]
git = "https://github.com/rust-vmm/seccompiler.git"
rev = "08587106340b8e3cb361c7561411510039436857"

[workspace.dependencies.zbus]
version = "5.18"
default-features = false
features = ["bus-impl", "p2p", "tokio"]

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[patch.crates-io]
quinn = { path = "vendor/quinn-0.11.11" }
quinn-proto = { path = "vendor/quinn-proto-0.11.16" }
rustls = { path = "vendor/rustls-0.23.43" }

[patch."https://github.com/hyperium/h3.git"]
h3 = { path = "vendor/h3" }
h3-datagram = { path = "vendor/h3-datagram" }
h3-webtransport = { path = "vendor/h3-webtransport" }
