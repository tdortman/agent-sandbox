[package]
name = "agent-sandbox-fsmon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agent-sandbox-fs-arm"
path = "src/bin/agent-sandbox-fs-arm.rs"

[[bin]]
name = "agent-sandbox-fsmon"
path = "src/bin/agent-sandbox-fsmon.rs"

[dependencies]
agent-sandbox-core = { path = "../core" }
agent-sandbox-sysutil = { path = "../sysutil" }

clap = { workspace = true, features = ["env"] }
libc.workspace = true
nix = { workspace = true, features = ["dir", "fs"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
