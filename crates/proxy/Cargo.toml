[package]
name = "agent-sandbox-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agent-sandbox-proxy"
path = "src/main.rs"

[dependencies]
agent-sandbox-core = { path = "../core" }

base64.workspace = true
clap = { workspace = true, features = ["env"] }
nix = { workspace = true, features = ["net", "socket"] }
rama-core.workspace = true
rama-dns.workspace = true
rama-http.workspace = true
rama-http-backend.workspace = true
rama-net.workspace = true
rama-tcp.workspace = true
rama-tls.workspace = true
rama-tls-boring.workspace = true
rama-tls-rustls.workspace = true
rcgen.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = {
  workspace = true,
  features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
  ]
}
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
